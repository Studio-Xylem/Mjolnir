spring.application.name=Mjolnir
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:h2:file:./data/mjolnir;MODE=PostgreSQL}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-this-32-bytes}
app.jwt.lifetime=${JWT_LIFETIME:PT2H}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
cloudinary.url=${CLOUDINARY_URL:}
server.port=${PORT:8080}
