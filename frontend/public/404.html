<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mjolnir — Lost &amp; Found</title>
    <script>
      // GitHub Pages SPA redirect trick
      // When GitHub Pages returns a 404 for a deep link (e.g. /Mjolnir/post/abc),
      // this page encodes the path into a query string and redirects to the root,
      // where index.html picks it up and restores the real URL via history.replaceState.
      // pathSegmentsToKeep = 1 preserves the /Mjolnir repo prefix.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
